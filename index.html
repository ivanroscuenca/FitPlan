*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}

.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.hd{display:flex;gap:8px;align-items:center;margin-bottom:6px}.hd input{width:20px;height:20px;accent-color:var(--ac)}
.ex{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--bd)}
.ex>div{flex:1;min-width:0}.ex i{color:var(--ac);font-style:normal;font-size:12px;font-weight:600;text-transform:uppercase}

input[data-l]{width:110px}
.anim{width:100%;max-width:340px;display:block;margin:6px auto;background:var(--bg);border-radius:10px}
.play{border:1px solid var(--bd);background:var(--bg);color:var(--ac);border-radius:8px;padding:2px 8px;font:inherit;font-size:13px;cursor:pointer;margin-left:6px}
.hl{outline:2px solid var(--ac)}
.row input{width:100%;display:block;margin-top:2px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px;font:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.row label{flex:1;min-width:140px;font-size:13px;color:var(--mut)}.row select{width:100%;display:block;margin-top:2px}
.bar{height:8px;border-radius:4px;background:var(--bd);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:4px;text-align:center;font-size:14px}input[data-b]{width:76px;text-align:center}

const keys=n=>[...new Set(n.toLowerCase().split("+").map(mk).filter(Boolean))];
const plays=n=>{const ks=keys(n);return ks.map(k=>`<button class="play" data-x="${k}">▶ ${ks.length>1?M[k].n:"Ver"}</button>`).join("")};
function pts(m,t){const n=m.p.length,c=(t/m.d)%1*n,i=Math.floor(c),f=c-i,e=(1-Math.cos(Math.PI*f))/2,a=m.p[i],b=m.p[(i+1)%n],q=a.map((v,k)=>v+(b[k]-v)*e),r=x=>x*Math.PI/180,v=(o,l,g)=>[o[0]+l*Math.cos(r(g)),o[1]+l*Math.sin(r(g))],P=[0,0],S=v(P,38,q[0]),E=v(S,18,q[1]),W=v(E,18,q[2]),K=v(P,24,q[3]),A=v(K,24,q[4]),H=v(S,12,q[5]),K2=v(P,24,q[6]),A2=v(K2,24,q[7]),T=v(A,10,q[8]),o={P,S,E,W,K,A,H,K2,A2,T},ys=[P,S,E,W,K,A,K2,A2].concat(m.foot?[T]:[],[[0,H[1]+5]]).map(p=>p[1]),dx=m.x-o[m.ax][0],dy=m.ay=="g"?130-q[9]-Math.max(...ys):m.y-o[m.ay][1];
for(const k in o)o[k]=[o[k][0]+dx,o[k][1]+dy];return o}
function draw(s,t){const m=M[s.dataset.m],o=pts(m,t),L=(...k)=>k.map(x=>o[x].map(n=>n.toFixed(1)).join(",")).join(" "),g=c=>s.querySelector(c);
g(".l2").setAttribute("points",L("P","K2","A2"));g(".bd").setAttribute("points",L("S","P"));g(".ar").setAttribute("points",L("S","E","W"));g(".l1").setAttribute("points",L("P","K","A")+(m.foot?" "+L("T"):""));
const h=g(".hd");h.setAttribute("cx",o.H[0]);h.setAttribute("cy",o.H[1])}
const svg=k=>{const m=M[k];return`<svg class="anim" viewBox="0 0 200 140" data-m="${k}" role="img" aria-label="${m.n}">${m.g?'<line x1="8" y1="133" x2="192" y2="133" stroke="var(--bd)" stroke-width="3"/>':""}${m.bar?`<line x1="${m.bar[0]}" y1="${m.bar[1]}" x2="${m.bar[2]}" y2="${m.bar[3]}" stroke="var(--mut)" stroke-width="4" stroke-linecap="round"/>`:""}<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5"><polyline class="l2" stroke="var(--mut)"/><polyline class="bd" stroke="var(--fg)"/><polyline class="ar" stroke="var(--ac)"/><polyline class="l1" stroke="var(--fg)"/><circle class="hd" r="8" stroke="var(--fg)"/></g></svg>`};
const exs=()=>'<p class="m">Animaciones de referencia de cada movimiento. Desde el Plan, pulsa ▶ en un ejercicio para verlo aquí. Cada variante se hace con la misma técnica base.</p>'+Object.keys(M).map(k=>`<section class="card" id="m-${k}"><b>${M[k].n}</b>${svg(k)}<p class="m">${M[k].t}</p></section>`).join("");
const loop=t=>{document.querySelectorAll("svg[data-m]").forEach(e=>draw(e,t/1000));requestAnimationFrame(loop)};
/*END*/
function hint(k,w,d){const L=lat(k);if(!L)return"";const o=w<3?(d<2?-1:0):w<5?1:0;const n=Math.min(5,Math.max(1,+L+o));return"Nivel "+n+": "+X[k].l[n-1]}
function plan(){const w=S.w,b=B(w);
let h='<div class="chips">'+[...Array(11)].map((_,i)=>`<button class="chip${i+1==w?" on":""}" data-w="${i+1}">${i+1}</button>`).join("")+`</div><h2>Semana ${w} · ${b.t}</h2><p class="m">${b.i}</p>`;
if(w==1)h+='<p class="m">Antes de empezar, haz el test inicial en la pestaña Niveles. Calienta 5 min antes de cada sesión y estira al terminar.</p>';
if(w==11)return h;
for(let d=0;d<4;d++){const id=w+"-"+d,t=w<3?T1[d]:w<7?T2[d]:"";
h+=`<section class="card"><label class="hd"><input type="checkbox" data-d="${id}"${S.done[id]?" checked":""}><b>Día ${d+1}</b>${t?" · "+t:""}</label>`;
items(w,d).forEach((s,i)=>{const[n,p,k]=s.split("|"),key=id+"-"+i,ht=k?hint(k,w,d):"";
h+=`<div class="ex"><div>${w<9&&i==4?"<i>Extra</i> ":""}${esc(n)}${plays(n)}<small>${esc(p||"")}${ht?(p?" · ":"")+ht:""}</small></div><input data-l="${key}" value="${esc(S.log[key])}" placeholder="resultado"></div>`});
h+="</section>"}
return h}
function lvls(){let h=`<p class="m">Test inicial (semana 1) y repetición en las semanas 4 y 8: haz cada ejercicio en tu nivel máximo e intenta cumplir el criterio para avanzar; si lo logras, prueba el siguiente nivel. Descansa 2 min entre ejercicios. Tu nivel máximo es el más alto que haces con buena técnica sin cumplir aún el criterio para pasar al siguiente.</p><div class="chips"><button class="chip${S.sex=="H"?" on":""}" data-s="H">Hombre</button><button class="chip${S.sex=="M"?" on":""}" data-s="M">Mujer</button></div>`;
for(const k in X){const x=X[k],L=lat(k);
h+=`<section class="card"><b>${x.n}</b><div class="row">`+[1,4,8].map(s=>`<label>Semana ${s}<select data-v="${k+s}"><option value="">–</option>${x.l.map((n,i)=>`<option value="${i+1}"${S.lv[k+s]==i+1?" selected":""}>${i+1} · ${n}</option>`).join("")}</select></label>`).join("")+"</div>"+(L?`<small>Para superar el nivel ${L}: ${(S.sex=="H"?x.h:x.m)[L-1]}</small>`:"")+"</section>"}
return h+'<p class="m">Nota: para la dominada clásica en mujeres, el libro indica 7 rep. en el capítulo y 5 en el anexo.</p>'}
function prog(){const n=Object.values(S.done).filter(Boolean).length;
let h=`<section class="card"><b>${n} / 40 sesiones completadas</b><div class="bar"><i style="width:${n*2.5}%"></i></div></section><section class="card"><b>Tus números</b><p class="m">Mídete una vez por semana y en las mismas condiciones. CT = suma de bíceps, cintura, cadera y muslos (cm). Hazte también una foto al empezar.</p><div class="tw"><table><tr><th>Sem<th>Sesiones<th>Peso (kg)<th>Cintura (cm)<th>CT (cm)</tr>`;
for(let w=1;w<=10;w++)h+=`<tr><td>${w}<td>${[0,1,2,3].filter(d=>S.done[w+"-"+d]).length}/4`+["p","c","t"].map(f=>`<td><input inputmode="decimal" data-b="${w+f}" value="${esc(S.body[w+f])}">`).join("")+"</tr>";
return h+"</table></div></section>"}
function render(){const y=scrollY;
if(!sb){$app.innerHTML=cfgView;return}
if(!user){$app.innerHTML=authView;return}
$app.innerHTML=`<h1>Desencadenado · 10 semanas</h1><small>Plan basado en el libro “Desencadenado. Tu cuerpo es tu gimnasio”</small><div class="chips">`+[["plan","Plan"],["ex","Ejercicios"],["lv","Niveles"],["pr","Progreso"]].map(([t,l])=>`<button class="chip${S.tab==t?" on":""}" data-tab="${t}">${l}</button>`).join("")+"</div>"+(S.tab=="plan"?plan():S.tab=="ex"?exs():S.tab=="lv"?lvls():prog())+(sb?'<p class="m"><span id="st"></span> <button class="chip" data-a="out">Salir</button></p>':'<p class="m">Tus datos se guardan en este navegador.</p>');
scrollTo(0,y);if(S.tab=="ex"&&S.fx){const e=document.getElementById("m-"+S.fx);S.fx=null;if(e){e.classList.add("hl");e.scrollIntoView()}}}
const $app=document.getElementById("app");
document.addEventListener("click",e=>{const t=e.target.closest("[data-w],[data-s],[data-tab],[data-a],[data-x]");if(!t)return;const d=t.dataset;if(d.x){S.tab="ex";S.fx=d.x;render();return}if(d.a){if(d.a=="out"){sb.auth.signOut();user=null;render()}else if(d.a=="cfg"){const u=document.getElementById("cu").value.trim(),k=document.getElementById("ck").value.trim();if(!u.startsWith("https://")||!k){$st("Revisa la URL y la clave");return}try{localStorage.setItem("sbu",u);localStorage.setItem("sbk",k)}catch(e){}location.reload()}else auth(d.a);return}if(d.w)S.w=+d.w;if(d.s)S.sex=d.s;if(d.tab)S.tab=d.tab;save();render()});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;if(d.d)S.done[d.d]=t.checked;else if(d.v)S.lv[d.v]=t.value;else return;save();render()});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;if(d.l)S.log[d.l]=t.value;else if(d.b)S.body[d.b]=t.value;else return;save()});
requestAnimationFrame(loop);
boot();
</script></body></html>
